# Production nginx vhost for alisadikinma.com
# Live at: /etc/nginx/sites-enabled/portfolio-8080
# Listen 8080 (Traefik proxy fronts 443 → 8080)
#
# This file is a SNAPSHOT of the production config. deploy.sh does NOT
# touch nginx — config drift requires manual sync. Reference this file
# when adding new location blocks, then SSH-edit the live config and
# `nginx -t && systemctl reload nginx`.
#
# Critical ordering rule: location blocks routing to Laravel index.php
# (API, OG SSR, /r/{code} shortener) MUST come BEFORE the catch-all
# `location /` that does `try_files ... /index.html`. Otherwise nginx
# serves the SPA's index.html for backend-handled paths.

# Map to determine if file exists in frontend
map $uri $frontend_path {
    default "";
    ~^/storage/projects/(.+)$ /var/www/Portfolio_v2/frontend/public/storage/projects/$1;
}

# Port 8080 Server Block (for Traefik proxy)
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # CRITICAL: Max upload size for bulk gallery upload (20 images @ 5MB each)
    client_max_body_size 150M;

    # Frontend Vue SPA root
    root /var/www/Portfolio_v2/frontend/dist;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    charset utf-8;

    # API Backend (Laravel)
    location /api/ {
        root /var/www/Portfolio_v2/backend/public;
        rewrite ^/api/(.*)$ /index.php?/$1 break;

        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/Portfolio_v2/backend/public/index.php;
        fastcgi_param REQUEST_URI /api/$1;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    # Project images - check both locations
    location ^~ /storage/projects/ {
        alias /var/www/Portfolio_v2/frontend/public/storage/projects/;
        try_files $uri $uri/ @backend_proj;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Backend project fallback - use root instead of alias
    location @backend_proj {
        root /var/www/Portfolio_v2/backend/storage/app/public;
        rewrite ^/storage/projects/(.*)$ /projects/$1 break;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Other storage files (Laravel storage)
    location ^~ /storage/ {
        alias /var/www/Portfolio_v2/backend/storage/app/public/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Uploads files (Backend public uploads)
    location ^~ /uploads/ {
        alias /var/www/Portfolio_v2/backend/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Frontend static assets with long cache
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|json)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # phpMyAdmin
    include snippets/phpmyadmin.conf;

    # ── SEO + GEO SSR-enrichment (homepage + blog surfaces) ──────────────────
    # Search engines and LLM/GEO crawlers (ChatGPT, Perplexity, Claude, Google
    # AI) do not run JS, so the SPA's runtime meta/schema/body injection is
    # invisible to them. These paths route to Laravel
    # (App\Http\Controllers\SpaPrerenderController via routes/web.php), which
    # loads frontend/dist/index.html and splices in per-page <head>, a JSON-LD
    # graph, hreflang and (for blog detail) a crawlable <article> body. Vue still
    # hydrates over #app for real users — SAME HTML for humans and bots
    # (progressive enhancement, NOT cloaking). Project detail keeps the lighter
    # OG-only injection (same controller file, routes/web.php project closure).
    #
    # ORDER MATTERS: these MUST stay above `location /` (the SPA catch-all) or
    # nginx serves the un-enriched index.html. The asset regex above only
    # matches file extensions, so extension-less paths fall through to here.

    # Homepage
    location = / {
        root /var/www/Portfolio_v2/backend/public;
        rewrite ^(.*)$ /index.php?$1 break;

        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/Portfolio_v2/backend/public/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60;
    }

    # FAQ — dedicated SSR surface (GEO Pillar 2). Single literal path, no locale
    # variants. SpaPrerenderController::faq renders config/faq.php into a
    # FAQPage JSON-LD block + crawlable <dl>. Must route to Laravel BEFORE the
    # SPA catch-all or nginx serves the un-enriched index.html.
    location = /faq {
        root /var/www/Portfolio_v2/backend/public;
        rewrite ^(.*)$ /index.php?$1 break;

        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/Portfolio_v2/backend/public/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60;
    }

    # Blog index (/blog), blog category (/blog/category/{slug}), blog detail
    # (/blog/{slug}) and project detail (/projects/{slug}) — each with an
    # optional /en or /id locale prefix. The category alternative (2 segments)
    # is listed first so the single-segment detail branch never swallows it.
    location ~ ^/(?:(?:en|id)/)?(?:blog(?:/category/[^/]+|/[^/]+)?|projects/[^/]+)/?$ {
        root /var/www/Portfolio_v2/backend/public;
        rewrite ^(.*)$ /index.php?$1 break;

        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/Portfolio_v2/backend/public/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60;
    }

    # Branded URL shortener — /r/{code} routes to Laravel index.php
    # (App\Http\Controllers\ShortLinkController). Must come BEFORE the
    # SPA catch-all or nginx serves frontend index.html instead.
    # Code regex matches base62 codes 4-16 chars (ShortLinkService generates 7).
    location ~ "^/r/[A-Za-z0-9]{4,16}$" {
        root /var/www/Portfolio_v2/backend/public;
        rewrite ^(.*)$ /index.php?$1 break;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/Portfolio_v2/backend/public/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 30;
    }

    # Vue Router SPA fallback
    # Prevent caching of index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Deny access to hidden files
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
