# Production nginx vhost for alisadikinma.com — PF-2 layout (Astro public site).
# Live at: /etc/nginx/sites-enabled/portfolio-8080
# Listen 8080 (Traefik proxy fronts 443 → 8080) + 127.0.0.1:8081 (loopback, Astro → Laravel)
#
# This file is a SNAPSHOT of the production config. deploy.sh does NOT
# touch nginx — config drift requires manual sync. Reference this file
# when adding new location blocks, then SSH-edit the live config and
# `nginx -t && systemctl reload nginx`. Cutover + rollback:
# docs/runbooks/pf2-astro-cutover.md.
#
# Who serves what (public server, port 8080):
#   Laravel (PHP-FPM) : /api/*, /r/{code}, /storage/*, /uploads/*   (/api/internal/* is 404 here)
#   Vue admin SPA     : /admin*, /login, /newsletter/unsubscribe (+ /assets/*, /sw.js)
#   Astro (node 4321) : everything else — pages, /_astro/*, /_image, /robots.txt,
#                       /sitemap*.xml, /llms.txt, web/public files (images, press kit…)
#
# Critical ordering rules (nginx picks the location in this order:
# `=` exact, then the longest `^~` prefix, then the FIRST matching regex in
# file order, then the longest plain prefix):
#  1. `^~` prefixes win over every regex: /_astro/, /_image, /assets/, /api/,
#     /storage/, /uploads/ are all `^~` or `=` so no regex below can swallow them.
#     There is NO extension regex (`~* \.(css|js|png…)$`) any more — it 404'd
#     Astro's /_astro/*.css|js and web/public/*.png because it did
#     `try_files $uri =404` against the SPA build root.
#  2. Regex locations (SPA routes, /r/{code}, dotfile deny) stay BELOW the `^~`
#     blocks. The SPA-route regex and /r/ regex are disjoint, so their order is free.
#  3. SPA routes use `try_files /index.html =404` (file found → served in place).
#     Do NOT use `try_files $uri /index.html`: the fallback is an internal
#     redirect that lands in `location /` (Astro) and 404s.
#  4. `location /` is the Astro catch-all and must stay last-resort. Anything the
#     SPA or Laravel must serve needs its own block above.
#  5. A location with its own `add_header` DROPS the server-level headers, so
#     blocks that add Cache-Control repeat the two security headers.

# Astro node server (portfolio-web.service). Keepalive saves a TCP handshake per page.
upstream portfolio_web {
    server 127.0.0.1:4321;
    keepalive 16;
}

# Traefik/Cloudflare terminate TLS and send X-Forwarded-Proto; fall back to our own scheme.
map $http_x_forwarded_proto $web_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Map to determine if file exists in frontend
map $uri $frontend_path {
    default "";
    ~^/storage/projects/(.+)$ /var/www/Portfolio_v2/frontend/public/storage/projects/$1;
}

# Port 8080 Server Block (for Traefik proxy) — PUBLIC
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # CRITICAL: Max upload size for bulk gallery upload (20 images @ 5MB each)
    client_max_body_size 150M;

    # Vue SPA root (admin, login, unsubscribe only after PF-2)
    root /var/www/Portfolio_v2/frontend/dist;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    charset utf-8;

    # Internal-only API (Astro → Laravel crawler-hit, shared-secret auth). Never public.
    # Astro reaches it through the loopback server below. No trailing slash on purpose:
    # `/api/internal` itself must 404 too. nginx merges `//`, decodes `%69`, and resolves
    # `..` before matching, so those spellings land here as well.
    location ^~ /api/internal {
        return 404;
    }

    # API Backend (Laravel)
    location ^~ /api/ {
        root /var/www/Portfolio_v2/backend/public;
        rewrite ^/api/(.*)$ /index.php?/$1 break;

        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/Portfolio_v2/backend/public/index.php;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    # Project images - check both locations
    location ^~ /storage/projects/ {
        alias /var/www/Portfolio_v2/frontend/public/storage/projects/;
        try_files $uri $uri/ @backend_proj;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Backend project fallback - use root instead of alias
    location @backend_proj {
        root /var/www/Portfolio_v2/backend/storage/app/public;
        rewrite ^/storage/projects/(.*)$ /projects/$1 break;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Other storage files (Laravel storage)
    location ^~ /storage/ {
        alias /var/www/Portfolio_v2/backend/storage/app/public/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Uploads files (Backend public uploads)
    location ^~ /uploads/ {
        alias /var/www/Portfolio_v2/backend/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- Astro: hashed build assets + image optimizer -------------------------
    # /_astro/* filenames carry a content hash → cache for a year. Astro's own
    # Cache-Control is hidden and a single add_header sets the only one (`expires` would
    # add a second Cache-Control line). add_header here drops the server-level headers,
    # so the two security headers are repeated.
    location ^~ /_astro/ {
        proxy_pass http://portfolio_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $web_forwarded_proto;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
    }

    # astro:assets endpoint (/_image?href=…&w=…&f=webp). Dynamic: Astro sets its own
    # caching headers, so this is a plain proxy.
    location = /_image {
        proxy_pass http://portfolio_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $web_forwarded_proto;
    }

    # ---- Vue SPA (admin only) ---------------------------------------------------
    # Vite build assets (/assets/<name>-<hash>.js|css). Astro has no /assets/ path
    # (its bundles live under /_astro/), so this never collides.
    location ^~ /assets/ {
        root /var/www/Portfolio_v2/frontend/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    # Kill-switch service worker. Browsers that installed the OLD public SPA's worker
    # re-fetch /sw.js, get this one, clear the media caches and unregister. It must
    # stay reachable (and never cached) or those browsers keep the stale worker.
    location = /sw.js {
        root /var/www/Portfolio_v2/frontend/dist;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        try_files /sw.js =404;
    }

    # phpMyAdmin
    include snippets/phpmyadmin.conf;

    # Branded URL shortener — /r/{code} routes to Laravel index.php
    # (App\Http\Controllers\ShortLinkController). Must stay BELOW the ^~ blocks and
    # ABOVE `location /` or Astro answers it with a 404 page.
    # Code regex matches base62 codes 4-16 chars (ShortLinkService generates 7).
    location ~ "^/r/[A-Za-z0-9]{4,16}$" {
        root /var/www/Portfolio_v2/backend/public;
        rewrite ^(.*)$ /index.php?$1 break;
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/Portfolio_v2/backend/public/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 30;
    }

    # Admin SPA entry points: /admin, /admin/…, /login, /newsletter/unsubscribe.
    # index.html is never cached so a new admin build is picked up at once.
    location ~ ^/(admin|login|newsletter/unsubscribe)(/|$) {
        root /var/www/Portfolio_v2/frontend/dist;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        try_files /index.html =404;
    }

    # Deny access to hidden files
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # ---- Astro: every public page ----------------------------------------------
    # Pages, /robots.txt, /sitemap*.xml, /llms.txt, web/public/* (images, press kit).
    # /api/sitemap*.xml and /api/llms*.txt stay Laravel (location ^~ /api/ above).
    location / {
        proxy_pass http://portfolio_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $web_forwarded_proto;
        proxy_read_timeout 30s;
    }
}

# Loopback server (127.0.0.1:8081) — Astro → Laravel, never reachable from outside.
# web/.env: API_INTERNAL_URL=http://127.0.0.1:8081/api
# Why a second port: the public server hides /api/internal/* (404). Astro's AI-crawler
# reporter needs it, so it talks to this listener, which also serves normal API reads.
# Laravel sees Host=alisadikinma.com + HTTPS=on, so absolute URLs it builds (image
# URLs in API payloads, etc.) are the public https ones, not http://127.0.0.1:8081.
server {
    listen 127.0.0.1:8081;
    server_name _;
    client_max_body_size 1M;
    charset utf-8;

    location ^~ /api/ {
        root /var/www/Portfolio_v2/backend/public;
        rewrite ^/api/(.*)$ /index.php?/$1 break;

        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/Portfolio_v2/backend/public/index.php;
        include fastcgi_params;
        fastcgi_param HTTP_HOST alisadikinma.com;
        fastcgi_param HTTPS on;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60;
    }

    # Same-host images for Astro's image-dims reader (IMAGE_DIMS_ORIGIN=http://127.0.0.1:8081):
    # no Cloudflare round trip. Project images keep the two-location lookup.
    location ^~ /storage/projects/ {
        alias /var/www/Portfolio_v2/frontend/public/storage/projects/;
        try_files $uri $uri/ @backend_proj_loopback;
    }

    location @backend_proj_loopback {
        root /var/www/Portfolio_v2/backend/storage/app/public;
        rewrite ^/storage/projects/(.*)$ /projects/$1 break;
    }

    location ^~ /storage/ {
        alias /var/www/Portfolio_v2/backend/storage/app/public/;
    }

    location ^~ /uploads/ {
        alias /var/www/Portfolio_v2/backend/public/uploads/;
    }

    location / {
        return 404;
    }
}
