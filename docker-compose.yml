# Lightweight dev stack: MySQL + Laravel API + admin SPA (Vite) + phpMyAdmin.
# The PUBLIC site is Astro (web/) since PF-2 and is NOT in this file. For the full
# site on one URL with a copy of prod data, use scripts/pf2-local.sh (docker/pf2-local/).
# Empty DB: run `docker compose exec backend php artisan migrate --seed`.
# Project name is pinned: the folder was renamed to alisadikinma-com, and without
# this line Docker would derive a new name and start on empty volumes.
name: portfolio_v2
services:
  mysql:
    image: mysql:8.0
    container_name: portfolio_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: portfolio_v2
      MYSQL_USER: portfolio
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=caching_sha2_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - portfolio

  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: portfolio_backend
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
      - backend_vendor:/var/www/backend/vendor
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - portfolio

  nginx:
    image: nginx:1.27-alpine
    container_name: portfolio_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/backend
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - portfolio

  frontend:
    image: node:20-alpine
    container_name: portfolio_frontend   # admin SPA only (/admin, /login)
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - portfolio

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: portfolio_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 256M
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - portfolio

volumes:
  mysql_data:
  backend_vendor:
  frontend_node_modules:

networks:
  portfolio:
    driver: bridge
