<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Debug - Portfolio V2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Courier New', monospace;
            padding: 2rem;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 { 
            color: #4fc3f7; 
            margin-bottom: 2rem;
            font-size: 1.5rem;
        }
        .endpoint {
            background: #252526;
            border: 1px solid #3c3c3c;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
        .endpoint-url {
            color: #4fc3f7;
            font-size: 1.1rem;
            margin-bottom: 1rem;
            word-break: break-all;
        }
        .response {
            background: #1e1e1e;
            border: 1px solid #3c3c3c;
            border-radius: 4px;
            padding: 1rem;
            max-height: 300px;
            overflow-y: auto;
            font-size: 0.9rem;
        }
        .success { color: #4ec9b0; }
        .error { color: #f48771; }
        .warning { color: #dcdcaa; }
        .key { color: #9cdcfe; }
        .string { color: #ce9178; }
        .number { color: #b5cea8; }
        .boolean { color: #569cd6; }
        button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 0.5rem;
            font-family: 'Courier New', monospace;
        }
        button:hover { background: #1177bb; }
        .status {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }
        .status-200 { background: #4ec9b0; color: #000; }
        .status-error { background: #f48771; color: #000; }
        .status-loading { background: #dcdcaa; color: #000; }
        pre { 
            white-space: pre-wrap; 
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 API Response Debug Tool</h1>
        
        <button onclick="testAllEndpoints()">🚀 Test All Endpoints</button>
        <button onclick="clearResults()">🗑️ Clear</button>
        
        <div id="results" style="margin-top: 2rem;"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost/Portfolio_v2/backend/public/api';
        
        const ENDPOINTS = [
            { name: 'Projects', url: '/projects?featured=true&limit=4' },
            { name: 'Projects (All)', url: '/projects' },
            { name: 'Posts', url: '/posts?limit=6' },
            { name: 'Awards', url: '/awards?limit=6' },
            { name: 'Galleries', url: '/galleries?limit=6' },
            { name: 'Categories', url: '/categories' },
            { name: 'Testimonials', url: '/testimonials' },
            { name: 'About Settings', url: '/settings/about' }
        ];

        async function testAllEndpoints() {
            const results = document.getElementById('results');
            results.innerHTML = '<p class="warning">⏳ Testing all endpoints...</p>';
            
            for (const endpoint of ENDPOINTS) {
                await testEndpoint(endpoint);
            }
        }

        async function testEndpoint(endpoint) {
            const results = document.getElementById('results');
            
            const div = document.createElement('div');
            div.className = 'endpoint';
            div.innerHTML = `
                <div class="endpoint-url">
                    <strong>${endpoint.name}</strong><br>
                    GET ${endpoint.url}
                </div>
                <div class="status status-loading">LOADING...</div>
                <div class="response" id="response-${endpoint.name.replace(/\s/g, '-')}">
                    Fetching...
                </div>
            `;
            results.appendChild(div);

            const responseDiv = div.querySelector('.response');
            const statusDiv = div.querySelector('.status');

            try {
                const start = performance.now();
                const response = await fetch(API_BASE + endpoint.url, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                const end = performance.now();
                const loadTime = Math.round(end - start);

                const data = await response.json();

                // Update status
                statusDiv.className = `status ${response.ok ? 'status-200' : 'status-error'}`;
                statusDiv.textContent = `HTTP ${response.status} (${loadTime}ms)`;

                // Format response
                const formatted = formatJSON(data);
                responseDiv.innerHTML = formatted;

                // Highlight issues
                if (!response.ok) {
                    responseDiv.innerHTML = `<span class="error">❌ HTTP ERROR ${response.status}</span>\n\n` + formatted;
                } else if (data.success === false) {
                    responseDiv.innerHTML = `<span class="error">❌ API SUCCESS: FALSE</span>\n\n` + formatted;
                } else if (data.success === true && (!data.data || (Array.isArray(data.data) && data.data.length === 0))) {
                    responseDiv.innerHTML = `<span class="warning">⚠️ SUCCESS BUT EMPTY DATA</span>\n\n` + formatted;
                } else {
                    responseDiv.innerHTML = `<span class="success">✅ SUCCESS</span>\n\n` + formatted;
                }

            } catch (err) {
                statusDiv.className = 'status status-error';
                statusDiv.textContent = 'ERROR';
                responseDiv.innerHTML = `<span class="error">❌ ${err.message}</span>\n\nPossible causes:\n- Backend not running\n- CORS error\n- Network timeout\n- Invalid JSON response`;
            }
        }

        function formatJSON(obj, indent = 0) {
            const spacing = '  '.repeat(indent);
            let html = '';

            if (obj === null) {
                return '<span class="keyword">null</span>';
            }

            if (typeof obj === 'boolean') {
                return `<span class="boolean">${obj}</span>`;
            }

            if (typeof obj === 'number') {
                return `<span class="number">${obj}</span>`;
            }

            if (typeof obj === 'string') {
                return `<span class="string">"${escapeHtml(obj)}"</span>`;
            }

            if (Array.isArray(obj)) {
                if (obj.length === 0) {
                    return '<span class="warning">[]</span>';
                }
                
                html += '[\n';
                obj.forEach((item, index) => {
                    html += spacing + '  ' + formatJSON(item, indent + 1);
                    if (index < obj.length - 1) html += ',';
                    html += '\n';
                });
                html += spacing + ']';
                return html;
            }

            if (typeof obj === 'object') {
                const keys = Object.keys(obj);
                if (keys.length === 0) {
                    return '{}';
                }

                html += '{\n';
                keys.forEach((key, index) => {
                    html += spacing + '  <span class="key">"' + key + '"</span>: ';
                    html += formatJSON(obj[key], indent + 1);
                    if (index < keys.length - 1) html += ',';
                    html += '\n';
                });
                html += spacing + '}';
                return html;
            }

            return String(obj);
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }

        // Auto-test on load
        window.addEventListener('load', () => {
            setTimeout(testAllEndpoints, 500);
        });
    </script>
</body>
</html>
