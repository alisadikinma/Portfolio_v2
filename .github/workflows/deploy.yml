name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:  # allow manual trigger from GitHub UI

concurrency:
  group: deploy-production
  cancel-in-progress: false  # never cancel a running deploy mid-flight

jobs:
  deploy:
    name: Auto-deploy to production VPS
    # Self-hosted runner installed on the VPS itself (systemd service, user
    # claudesn). The job runs LOCALLY on the box, so there is NO inbound SSH
    # from GitHub's runner IPs — which is what kept timing out: Hostinger's
    # edge firewall silently drops SYN packets from GitHub's Azure ranges, and
    # those IPs are ephemeral so deploys failed intermittently. The runner only
    # makes an OUTBOUND HTTPS (443) long-poll to GitHub, which always succeeds.
    runs-on: [self-hosted, portfolio-vps]
    timeout-minutes: 15

    steps:
      - name: Deploy in place (git reset + deploy.sh)
        env:
          PROJECT_PATH: ${{ secrets.VPS_PROJECT_PATH }}
        run: |
          set -euo pipefail
          cd "$PROJECT_PATH"
          git fetch origin main
          git reset --hard origin/main
          bash scripts/deploy.sh

      - name: Verify deploy via /api/health
        run: |
          sleep 3
          curl --fail --silent --show-error --max-time 15 \
            https://alisadikinma.com/api/health \
            -o /tmp/health.json
          cat /tmp/health.json
